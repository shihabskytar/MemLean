[package]
name = "memlean-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "MemLean CLI: grouped process dump (Milestone 1)"

[[bin]]
name = "memlean-cli"
path = "src/main.rs"

[dependencies]
memlean-core = { path = "../core" }
memlean-win = { path = "../win" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
