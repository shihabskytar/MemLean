[package]
name = "memlean-win"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "MemLean Windows-only process snapshotting via Toolhelp32/PSAPI (all unsafe code lives here)"

[dependencies]
memlean-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
